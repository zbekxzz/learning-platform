  # ─── Tests ──────────────────────────────────────────────────────────
  /tests/module/{module_id}/start:
    get:
      tags: [Tests]
      summary: Start a test
      description: |
        Fetches the test for a module, creates an attempt, and returns  
        questions with answers (correct answers are hidden).
      operationId: startTest
      security:
        - BearerAuth: []
      parameters:
        - name: module_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Module ID
      responses:
        "200":
          description: Test started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartTestResponse"
        "500":
          description: Failed to start test
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tests/submit:
    post:
      tags: [Tests]
      summary: Submit test answers
      description: |
        Submits the user's answers for a test. Returns the score  
        (number of correct answers) and updates the attempt record.
      operationId: submitTest
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitTestRequest"
      responses:
        "200":
          description: Test submitted, score returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitTestResponse"
